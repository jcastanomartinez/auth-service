spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:auth-db}:${DB_PORT:5432}/${DB_NAME:auth}
    username: ${DB_USER:auth_user}
    password: "${DB_PASSWORD:T0byt081*}"
