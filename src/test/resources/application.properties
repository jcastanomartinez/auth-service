# =====================================================================
# CONFIGURACIÓN DE BASE DE DATOS PARA TESTS (Postgres Local en Puerto 5434)
# =====================================================================
# Usamos tu contenedor activo 'facturacion-db-local' para evitar fallos de Testcontainers en Fedora
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=auth_user
spring.datasource.password=T0byt081*
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =====================================================================
# Crea las tablas automáticamente en cada ejecución del test y las borra al finalizar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# CONFIGURACIÓN DE SEGURIDAD / JWT
# =====================================================================
# Clave simétrica de prueba para firmar los tokens JWT en los entornos de test
jwt.secret=9a4f2c8d3e7b1a5f6c8d9e0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
jwt.expiration=3600000

